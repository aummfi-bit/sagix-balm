# Copy to config.toml and edit. Nothing in here is a credential: prices come
# from Cboe's public delayed feed, which needs no account and no key.

snapshot_dir = "data/snapshots"

# One tab per underlying in the canvas. Two is the intended layout, but the
# list is not fixed length -- add or remove entries freely.

[[underlyings]]
symbol = "GLXY"
label = "Galaxy Digital"

# The plan block names the structure to model. `balm plan` uses all of it;
# `balm quotes` keeps the strikes and expiries but takes spot and implied
# volatility from the feed. Volatilities are decimals: 0.98 means 98%.
[underlyings.plan]
spot = 22.70
anchor_strike = 22.5
anchor_expiry = 2027-01-15
anchor_iv = 0.98
short_strike = 22.0
short_expiry = 2026-08-14
short_iv = 1.10
contracts = 1
# What you actually got filled at, used by the harvest-target check.
short_credit = 1.21
# Leverage of 30-day IV to spot: 1.5 means a 10% drop lifts 30-day IV by 15
# points. Crypto-linked single names react hard; broad ETFs do not.
vol_beta = 1.5

# Long-dated expiries to compare in the anchor selection table.
[[underlyings.plan.anchor_expiry_candidates]]
expiry = 2027-01-15
iv = 0.98
[[underlyings.plan.anchor_expiry_candidates]]
expiry = 2028-01-21
iv = 0.90

[[underlyings]]
symbol = "IBIT"
label = "iShares Bitcoin Trust"

[underlyings.plan]
spot = 36.03
anchor_strike = 36.0
anchor_expiry = 2027-01-15
anchor_iv = 0.421
short_strike = 35.0
short_expiry = 2026-08-14
short_iv = 0.361
contracts = 1
short_credit = 0.38
vol_beta = 0.7

[[underlyings.plan.anchor_expiry_candidates]]
expiry = 2027-01-15
iv = 0.421
[[underlyings.plan.anchor_expiry_candidates]]
expiry = 2028-01-21
iv = 0.478

[model]
risk_free_rate = 0.04
dividend_yield = 0.0
binomial_steps = 240
strike_window = 0.25
expirations = 8
quote_timeout = 20.0

[rules]
# Monday=0. Never carry an open short weekly past this weekday.
roll_by_weekday = 2
extrinsic_harvest_target = 0.80
short_delta_target = 0.40
short_delta_max = 0.55
assignment_warn_premium = 0.10
max_spread_pct = 0.10
